<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in or sign up · Ailobang</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfd;
        --fg: #16161a;
        --muted: #6b6b76;
        --card: #ffffff;
        --accent: #16161a;
        --accent-fg: #ffffff;
        --border: rgba(0, 0, 0, 0.12);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0d10;
          --fg: #f4f4f6;
          --muted: #9a9aa5;
          --card: #16161a;
          --accent: #f4f4f6;
          --accent-fg: #16161a;
          --border: rgba(255, 255, 255, 0.16);
          --shadow: none;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        padding: 32px 28px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 14px;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: var(--accent-fg);
        font: inherit;
        font-weight: 550;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      .btn:hover {
        opacity: 0.88;
      }
      .back {
        display: block;
        margin-top: 20px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Log in or sign up</h1>
      <p>Enter your email to continue. New here? We'll set up your account.</p>
      <a class="btn" href="/auth/login">Log in / Sign up</a>
      <a class="back" href="/">Back home</a>
    </main>
  </body>
</html>
